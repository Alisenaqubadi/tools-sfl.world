<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFL Marketplace & Recipe Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for specific status colors */
        .bg-profit { background-color: #b6d7a8; color: #1f2937; } /* Green */
        .bg-loss { background-color: #ea9999; color: #1f2937; }   /* Red */
        .bg-neutral { background-color: #f3f4f6; color: #9ca3af; } /* Gray */

</head>
<body class="bg-gray-100 p-6 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6">
        
        <!-- HEADER & FETCH -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-700">🌻 SFL Calculator</h1>
                <p class="text-xs text-gray-500 mt-1">
                    Created by <a href="https://sunflower-land.com/play/#/visit/7352930506392777" target="_blank" class="text-blue-600 hover:underline font-bold">Get Zen</a>
                </p>
            </div>
            
            <div class="flex items-center gap-4 mt-4 md:mt-0">
                <span id="status-text" class="text-sm text-gray-500 italic">Initializing...</span>
                <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                    Refresh Prices
                </button>
            </div>
        </div>

        <!-- SETTINGS: THRESHOLD & MULTIPLIER -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-blue-50 p-4 rounded-md border border-blue-100">
            <!-- Threshold Item -->
            <div>
                <label class="block text-sm font-bold mb-1">Threshold Item</label>
                <select id="threshold-item-select" onchange="runAnalysis()" class="w-full border rounded p-2 shadow-sm">
                    <option value="Auto Select">Auto Select (Loading...)</option>
                    <!-- Options populated by JS -->
                </select>
            </div>

            <!-- Multiplier Input -->
            <div>
                <label class="block text-sm font-bold mb-1">Multiplier</label>
                <input type="number" id="multiplier-input" value="1" step="0.1" oninput="runAnalysis()" class="w-full border rounded p-2 shadow-sm">
            </div>

            <!-- Result Display -->
            <div class="flex flex-col justify-center">
                <span class="text-xs text-gray-500 uppercase font-bold">Effective Threshold</span>
                <div class="flex items-baseline gap-2">
                    <span id="threshold-display" class="text-2xl font-mono font-bold text-gray-800">0.0000</span>
                    <span class="text-xs text-gray-500">SFL</span>
                </div>
            </div>
        </div>

        <!-- MAIN ANALYSIS TABLE -->
        <div class="overflow-x-auto mb-8">
            <table class="w-full text-sm text-left border-collapse">

                    <tr>
                        <th class="px-4 py-3 rounded-tl-lg">Category</th>
                        <th class="px-4 py-3">Recipe Selection</th>
                        <th class="px-4 py-3 text-center">Base</th>
                        <th class="px-4 py-3 text-center">1.5x Boost</th>
                        <th class="px-4 py-3 text-center">2x Boost</th>
                        <th class="px-4 py-3 rounded-tr-lg text-center">3x Boost</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 border border-gray-200">
                    <!-- ROW 1 -->
                    <tr class="bg-white">
                        <td class="px-4 py-3 font-medium">Food 1 (200/30)</td>
                        <td class="px-4 py-3">
                            <select id="recipe-select-1" onchange="runAnalysis()" class="w-full border rounded p-1 recipe-dropdown">
                                <option value="">Select Recipe...</option>
                            </select>
                        </td>
                        <td id="r1-base" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r1-1.5" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r1-2" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r1-3" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                    </tr>
                    <!-- ROW 2 -->
                    <tr class="bg-white">
                        <td class="px-4 py-3 font-medium">Food 2 (200/110)</td>
                        <td class="px-4 py-3">
                            <select id="recipe-select-2" onchange="runAnalysis()" class="w-full border rounded p-1 recipe-dropdown">
                                <option value="">Select Recipe...</option>
                            </select>
                        </td>
                        <td id="r2-base" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r2-1.5" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r2-2" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r2-3" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                    </tr>
                    <!-- ROW 3 -->
                    <tr class="bg-white">
                        <td class="px-4 py-3 font-medium">Food 3 (200/310)</td>
                        <td class="px-4 py-3">
                            <select id="recipe-select-3" onchange="runAnalysis()" class="w-full border rounded p-1 recipe-dropdown">
                                <option value="">Select Recipe...</option>
                            </select>
                        </td>
                        <td id="r3-base" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r3-1.5" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r3-2" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                        <td id="r3-3" class="px-4 py-3 text-center font-mono font-bold bg-neutral">-</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- TOGGLE MARKETPLACE -->
        <details class="bg-white border rounded-lg shadow-sm">
            <summary class="px-4 py-2 font-bold cursor-pointer bg-gray-50 hover:bg-gray-100 rounded-lg">View Marketplace Prices & Recipe Costs</summary>
            <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Raw Prices -->
                <div>
                    <h3 class="font-bold mb-2 text-gray-700 border-b">Raw Item Prices</h3>
                    <div class="h-64 overflow-y-auto border rounded text-sm">
                        <table class="w-full text-left">
                            <tbody id="marketplace-table-body" class="divide-y">
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Recipe Costs -->
                <div>
                    <h3 class="font-bold mb-2 text-gray-700 border-b">Calculated Recipe Costs</h3>
                    <div class="h-64 overflow-y-auto border rounded text-sm">
                        <table class="w-full text-left">
                            <tbody id="recipe-cost-table-body" class="divide-y">
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </details>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>

            {n: "Bumpkin Detox", i: [["Apple", 5], ["Orange", 5], ["Carrot", 10]]},
            {n: "The Lot", i: [["Blueberry", 1], ["Orange", 1], ["Grape", 1], ["Apple", 1], ["Banana", 1]]},
            {n: "Banana Blast", i: [["Banana", 10], ["Egg", 10]]},
            {n: "Slow Juice", i: [["Grape", 10], ["Kale", 100]]},
            {n: "Carrot Juice", i: [["Carrot", 30]]},
            {n: "Quick Juice", i: [["Sunflower", 50], ["Pumpkin", 40]]},
            {n: "Lemon Cheesecake", i: [["Lemon", 20], ["Milk", 15], ["Egg", 40]]},
            {n: "Honey Cake", i: [["Honey", 10], ["Wheat", 10], ["Egg", 20]]},
            {n: "Orange Cake", i: [["Orange", 5], ["Egg", 30], ["Wheat", 10]]},
            {n: "Apple Pie", i: [["Apple", 5], ["Wheat", 10], ["Egg", 20]]},
            {n: "Kale & Mushroom Pie", i: [["Wild Mushroom", 10], ["Kale", 5], ["Wheat", 5]]},
            {n: "Sunflower Cake", i: [["Sunflower", 1000], ["Wheat", 10], ["Egg", 30]]},
            {n: "Potato Cake", i: [["Potato", 500], ["Wheat", 10], ["Egg", 30]]},
            {n: "Pumpkin Cake", i: [["Pumpkin", 130], ["Wheat", 10], ["Egg", 30]]},
            {n: "Eggplant Cake", i: [["Eggplant", 30], ["Wheat", 10], ["Egg", 30]]},
            {n: "Carrot Cake", i: [["Carrot", 120], ["Wheat", 10], ["Egg", 30]]},
            {n: "Cabbage Cake", i: [["Cabbage", 90], ["Wheat", 10], ["Egg", 30]]},
            {n: "Beetroot Cake", i: [["Beetroot", 100], ["Wheat", 10], ["Egg", 30]]},
            {n: "Parsnip Cake", i: [["Parsnip", 45], ["Wheat", 10], ["Egg", 30]]},
            {n: "Cauliflower Cake", i: [["Cauliflower", 60], ["Wheat", 10], ["Egg", 30]]},
            {n: "Cornbread", i: [["Corn", 15], ["Wheat", 5], ["Egg", 10]]},
            {n: "Radish Cake", i: [["Radish", 25], ["Wheat", 10], ["Egg", 30]]},
            {n: "Wheat Cake", i: [["Wheat", 35], ["Egg", 30]]}
        ];

        // Global State
        let globalPriceMap = {};
        let globalRecipeCosts = {};

        // --- 2. INITIALIZATION ---
        window.onload = function() {
            populateThresholdDropdown();
            // Automatically start fetch
            fetchData();
        };

        function populateThresholdDropdown(autoText = "Auto Select") {
            const select = document.getElementById('threshold-item-select');
            // Keep current selection if exists
            const currentVal = select.value;

            select.innerHTML = '';
            
            // Add Auto Option
            const autoOpt = document.createElement('option');
            autoOpt.value = 'Auto Select';
            autoOpt.text = autoText;
            select.appendChild(autoOpt);

            // Add standard items
            comparisonItems.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.text = item;
                select.appendChild(opt);
            });

            // Restore selection or default to Auto
            if (currentVal && (comparisonItems.includes(currentVal) || currentVal === 'Auto Select')) {
                select.value = currentVal;
            } else {
                select.value = 'Auto Select';
            }
        }

        function populateRecipeDropdowns() {
            // Sort recipes alphabetically
            const sortedRecipes = Object.keys(globalRecipeCosts).sort();
            
            // The 3 select inputs
            const selects = ['recipe-select-1', 'recipe-select-2', 'recipe-select-3'];

            selects.forEach(id => {
                const el = document.getElementById(id);
                const currentVal = el.value; // preserve selection

                el.innerHTML = '<option value="">Select Recipe...</option>';
                
                sortedRecipes.forEach(rName => {
                    const opt = document.createElement('option');
                    opt.value = rName;
                    opt.text = rName;
                    el.appendChild(opt);
                });

                if(currentVal) el.value = currentVal;
            });
        }

        // --- 3. FETCH DATA ---
        async function fetchData() {
            const statusEl = document.getElementById('status-text');
            statusEl.textContent = "Fetching data...";
            statusEl.className = "text-sm text-blue-500 italic font-bold";

            try {
                // Using allorigins proxy to bypass CORS on static sites
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://sfl.world/api/v1/prices'));
                const proxyData = await response.json();
                const json = JSON.parse(proxyData.contents);

                // Process logic similar to Google Script
                let priceData = json;
                if(priceData.data) priceData = priceData.data;
                if(priceData.p2p) priceData = priceData.p2p;

                globalPriceMap = {};
                
                for (const key in priceData) {
                    const val = priceData[key];
                    let finalPrice = 0;
                    if(typeof val === 'object' && val !== null && 'current' in val) {
                        finalPrice = Number(val.current);
                    } else {
                        finalPrice = Number(val);
                    }
                    if(!isNaN(finalPrice)) {
                        globalPriceMap[key] = finalPrice;
                    }
                }

                // 1. Calculate Recipe Costs
                calculateRecipes();

                // 2. Update UI Lists
                renderMarketplaceTables();
                populateRecipeDropdowns();
                
                // 3. Run Analysis
                runAnalysis();

                statusEl.textContent = "Data Updated Successfully!";
                statusEl.className = "text-sm text-green-600 font-bold";

            } catch (error) {
                console.error(error);
                statusEl.textContent = "Error fetching data. Check console.";
                statusEl.className = "text-sm text-red-600 font-bold";
            }
        }

        // --- 4. CALCULATION LOGIC ---
        function calculateRecipes() {
            globalRecipeCosts = {};

            recipesList.forEach(recipe => {
                let totalCost = 0;
                recipe.i.forEach(ing => {
                    const name = ing[0];
                    const qty = ing[1];
                    let price = 0;

                    if(name in fixedCosts) {
                        price = fixedCosts[name];
                    } else if (name in globalPriceMap) {
                        price = globalPriceMap[name];
                    }
                    totalCost += (price * qty);
                });
                globalRecipeCosts[recipe.n] = totalCost;
            });
        }

        // --- 5. ANALYSIS & THRESHOLD ---
        function runAnalysis() {
            if(Object.keys(globalPriceMap).length === 0) return;

            // --- A. Determine Highest Price for Auto ---
            let maxVal = 0;
            let maxName = "None";

            comparisonItems.forEach(item => {
                if(item in globalPriceMap) {
                    let val = globalPriceMap[item];
                    if(item === "Moonfur") val = val * (200/1000);
                    
                    if(val > maxVal) {
                        maxVal = val;
                        maxName = item;
                    }
                }
            });

            // Update Auto Label
            const autoLabel = `Auto Select (${maxName})`;
            const selectEl = document.getElementById('threshold-item-select');
            
            // Only update the TEXT of the first option, don't destroy selection
            selectEl.options[0].text = autoLabel;

            // --- B. Determine Base Threshold ---
            let baseRefPrice = 0;
            const selectedVal = selectEl.value;

            if(selectedVal === 'Auto Select') {
                baseRefPrice = maxVal;
            } else {
                if(selectedVal in globalPriceMap) {
                    baseRefPrice = globalPriceMap[selectedVal];
                    if(selectedVal === "Moonfur") {
                        baseRefPrice = baseRefPrice * (200/1000);
                    }
                }
            }

            // --- C. Apply Multiplier ---
            const multInput = document.getElementById('multiplier-input');
            let multiplier = parseFloat(multInput.value);
            if(isNaN(multiplier) || multiplier <= 0) multiplier = 1;

            const finalThreshold = baseRefPrice * multiplier;

            // Display Threshold
            document.getElementById('threshold-display').textContent = finalThreshold.toFixed(4);

            // --- D. Update Grid Rows ---
            updateRow(1, 200, 30, finalThreshold);
            updateRow(2, 200, 110, finalThreshold);
            updateRow(3, 200, 310, finalThreshold);
        }

        function updateRow(rowId, numerator, baseDenom, threshold) {
            const selectEl = document.getElementById(`recipe-select-${rowId}`);
            const recipeName = selectEl.value;

            // Elements for cols
            const cells = [
                { id: `r${rowId}-base`, mult: 1 },
                { id: `r${rowId}-1.5`, mult: 1.5 },
                { id: `r${rowId}-2`, mult: 2 },
                { id: `r${rowId}-3`, mult: 3 }
            ];

            cells.forEach(cellObj => {
                const cellEl = document.getElementById(cellObj.id);
                
                // Reset classes
                cellEl.className = "px-4 py-3 text-center font-mono font-bold";

                if(!recipeName) {
                    cellEl.textContent = "-";
                    cellEl.classList.add("bg-neutral");
                    return;
                }

                if(recipeName in globalRecipeCosts) {
                    const cost = globalRecipeCosts[recipeName];
                    const currentDenom = baseDenom * cellObj.mult;
                    const metric = cost * (numerator / currentDenom);

                    // Percent Difference
                    let percentDiff = 0;
                    if (threshold !== 0) {
                        percentDiff = (threshold - metric) / threshold;
                    }

                    // Format Percentage
                    const percentStr = (percentDiff * 100).toFixed(2) + "%";
                    cellEl.textContent = percentStr;

                    // Color Logic (Green if metric < threshold, aka Profit > 0)
                    if(metric < threshold) {
                        cellEl.classList.add("bg-profit"); // Green
                    } else {
                        cellEl.classList.add("bg-loss");   // Red
                    }

                } else {
                    cellEl.textContent = "Err";
                    cellEl.classList.add("bg-neutral");
                }
            });
        }

        // --- 6. RENDER OPTIONAL TABLES ---
        function renderMarketplaceTables() {
            // Raw Prices
            const rawBody = document.getElementById('marketplace-table-body');
            rawBody.innerHTML = '';
            
            const sortedItems = Object.keys(globalPriceMap).sort();
            sortedItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="px-2 py-1">${item}</td><td class="px-2 py-1 font-mono">${globalPriceMap[item].toFixed(4)}</td>`;
                rawBody.appendChild(tr);
            });

            // Recipe Costs
            const recipeBody = document.getElementById('recipe-cost-table-body');
            recipeBody.innerHTML = '';
            
            const sortedRecipes = Object.keys(globalRecipeCosts).sort();
            sortedRecipes.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="px-2 py-1">${r}</td><td class="px-2 py-1 font-mono">${globalRecipeCosts[r].toFixed(4)}</td>`;
                recipeBody.appendChild(tr);
            });
        }

    </script>
